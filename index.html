<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#168447">
<meta name="description" content="IMDS Social Jules Enock">
<title>IMDS Social Jules Enock</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f7f4;
  color:#173b29;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

header{
  background:#168447;
  color:white;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 8px #0002;
}
.logo{
  font-weight:bold;
  font-size:18px;
}
.header-user{
  font-size:13px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.card{
  background:white;
  border-radius:15px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 2px 10px #0001;
}

h1,h2,h3{margin-top:0}
.gold{color:#b78a16}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  background:#168447;
  color:white;
  font-weight:bold;
}
.btn.goldbtn{background:#c99a20}
.btn.gray{background:#64748b}
.btn.red{background:#c62828}
.btn.light{
  background:#e8f4ed;
  color:#126b39;
}
.btn.full{width:100%}

textarea,input,select{
  width:100%;
  padding:11px;
  border:1px solid #cbd5d1;
  border-radius:9px;
  margin:6px 0 12px;
  background:white;
}
textarea{min-height:100px;resize:vertical}

label{
  font-size:13px;
  font-weight:bold;
}

.auth{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(145deg,#e8f5ed,#fffbea);
}

.auth-box{
  width:100%;
  max-width:480px;
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 5px 25px #0002;
}

.brand{
  text-align:center;
  margin-bottom:20px;
}
.brand-icon{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:50%;
  background:#168447;
  color:#ffd84d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:bold;
}
.brand h1{
  color:#168447;
  margin:10px 0 3px;
}
.brand p{
  margin:0;
  color:#66736d;
}

.auth-actions{
  display:grid;
  gap:10px;
  margin-top:15px;
}

.role-info{
  padding:10px;
  background:#f1f8f4;
  border-left:4px solid #168447;
  border-radius:7px;
  margin-bottom:12px;
  font-size:13px;
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:16px;
}
.nav button{
  border:0;
  background:white;
  border-radius:10px;
  padding:10px 5px;
  color:#24543b;
  box-shadow:0 1px 5px #0001;
}
.nav button.active{
  background:#168447;
  color:white;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}
.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#168447;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}
.post-meta{
  font-size:12px;
  color:#68766f;
}
.post-content{
  margin:15px 0;
  white-space:pre-wrap;
}
.post-actions{
  display:flex;
  gap:8px;
}
.post-actions button{
  border:0;
  background:#eef5f1;
  border-radius:8px;
  padding:8px 12px;
}

.classes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.class-card{
  background:#eef8f2;
  border:1px solid #cde5d7;
  border-radius:12px;
  padding:15px;
  text-align:center;
  font-weight:bold;
}

.profile{
  text-align:center;
}
.profile-avatar{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:50%;
  background:#168447;
  color:#ffd84d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  font-weight:bold;
}
.badge{
  display:inline-block;
  background:#fff1bd;
  color:#795d00;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.info-row{
  padding:10px 0;
  border-bottom:1px solid #e5e7eb;
}
.info-row:last-child{border-bottom:0}

.notice{
  background:#fff8d9;
  border-left:5px solid #d3a321;
}

  color:#
